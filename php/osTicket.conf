<VirtualHost *:80>
        ServerName localhost
        Redirect 301 / https://${DOMAIN_URL}/
</VirtualHost>

<VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/osTicket-1.18.4
        RedirectMatch 301 "^/$" https://${DOMAIN_URL}/scp/
        SSLEngine on
        SSLCertificateFile /etc/tls-certs/fullchain.pem
        SSLCertificateKeyFile /etc/tls-certs/privkey.pem
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>