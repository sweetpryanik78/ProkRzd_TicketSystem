<VirtualHost *:80>
        ServerName localhost
        Redirect permanent / https://${DOMAIN_URL}/
</VirtualHost>

<VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/osTicket-1.18.4
        SSLEngine on
        SSLCertificateFile /etc/cert/${DOMAIN_URL}/${DOMAIN_URL}.crt
        SSLCertificateKeyFile /etc/cert/${DOMAIN_URL}/${DOMAIN_URL}.key
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>