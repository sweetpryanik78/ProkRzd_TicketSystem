<VirtualHost *:80>
        ServerName localhost
        Redirect 301 / https://${DOMAIN_NAME}/
</VirtualHost>

<VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/osTicket-1.18.4
        RedirectMatch 301 "^/$" https://${DOMAIN_NAME}/scp/
        SSLEngine on
        SSLCertificateFile /etc/tls-certs/${DOMAIN_NAME}/fullchain.pem
        SSLCertificateKeyFile /etc/tls-certs/${DOMAIN_NAME}/privkey.pem
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>