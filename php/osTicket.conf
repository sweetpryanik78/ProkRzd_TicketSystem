<VirtualHost *:80>
        ServerName spb-prok.duckdns.org
        Redirect permanent "/" "https://spb-prok.duckdns.org/"
</VirtualHost>

<VirtualHost *:443>
        ServerName spb-prok.duckdns.org
        DocumentRoot /var/www/osTicket-1.18.4
        SSLEngine on
        SSLCertificateFile /etc/cert/${DOMAIN_URL}/${DOMAIN_URL}.crt
        SSLCertificateKeyFile /etc/cert/${DOMAIN_URL}/${DOMAIN_URL}.key
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
